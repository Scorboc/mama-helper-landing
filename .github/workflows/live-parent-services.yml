name: Live parenting chat scenarios
on:
  # Live AI requests require a deliberate manual run.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-stream-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/smoke-services.mjs
        env:
          MAMA_API_URL: https://mama-helper-ai-proxy.reborntechsar.workers.dev
