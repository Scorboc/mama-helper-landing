name: Deploy AI proxy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'ai-proxy/**'
      - '.github/workflows/deploy-ai-proxy.yml'

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Cloudflare Worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-proxy
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CHEAPAI_API_KEY: ${{ secrets.CHEAPAI_API_KEY }}
      PROXY_TOKEN: ${{ secrets.PROXY_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required secrets
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN secret" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID secret" && exit 1)
          test -n "$CHEAPAI_API_KEY" || (echo "Missing CHEAPAI_API_KEY secret" && exit 1)
          test -n "$PROXY_TOKEN" || (echo "Missing PROXY_TOKEN secret" && exit 1)

      - name: Install dependencies
        run: npm install

      - name: Save Worker secrets
        run: |
          printf '%s' "$CHEAPAI_API_KEY" | npx wrangler secret put CHEAPAI_API_KEY
          printf '%s' "$PROXY_TOKEN" | npx wrangler secret put PROXY_TOKEN

      - name: Deploy Worker
        run: npm run deploy
