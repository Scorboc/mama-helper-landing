name: Deploy AI proxy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'ai-proxy/**'
      - '.github/workflows/deploy-ai-proxy.yml'

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Cloudflare Worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-proxy
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CHEAPAI_API_KEY: ${{ secrets.CHEAPAI_API_KEY }}
      PROXY_TOKEN: ${{ secrets.PROXY_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test parenting safeguards
        run: node --test care.test.mjs services.test.mjs

      - name: Check required secrets
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN secret" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID secret" && exit 1)
          test -n "$CHEAPAI_API_KEY" || (echo "Missing CHEAPAI_API_KEY secret" && exit 1)
          test -n "$PROXY_TOKEN" || (echo "Missing PROXY_TOKEN secret" && exit 1)

      - name: Install dependencies
        run: npm install

      - name: Save Worker secrets
        run: |
          printf '%s' "$CHEAPAI_API_KEY" | npx wrangler secret put CHEAPAI_API_KEY
          printf '%s' "$PROXY_TOKEN" | npx wrangler secret put PROXY_TOKEN

      - name: Deploy Worker
        run: |
          set -o pipefail
          npm run deploy 2>&1 | tee worker-deploy.log
          grep -Eo 'https://[^[:space:]]+\.workers\.dev' worker-deploy.log | tail -n 1 > worker-url.txt
          test -s worker-url.txt || echo 'Worker URL was not printed by Wrangler. Open Cloudflare Dashboard > Workers & Pages > Overview and search for mama-helper-ai-proxy.' > worker-url.txt

      - name: Upload Worker URL
        uses: actions/upload-artifact@v4
        with:
          name: worker-url
          path: ai-proxy/worker-url.txt

      - name: Test ten live scenarios in a synthetic account
        env:
          MAMA_API_URL: https://mama-helper-ai-proxy.reborntechsar.workers.dev
        run: node ../scripts/smoke-services.mjs
