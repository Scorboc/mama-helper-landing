name: Check parent services
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - run: node --test ai-proxy/care.test.mjs ai-proxy/services.test.mjs
      - run: node scripts/test-parent-model.mjs && node scripts/test-preschool.mjs
